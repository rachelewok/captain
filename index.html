<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Captain">
<meta name="theme-color" content="#0f0a1e">
<title>Captain of the Throwers</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋🏼‍♀️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    min-height: 100vh; min-height: 100dvh;
    background: linear-gradient(160deg, #0f0a1e 0%, #1a1035 40%, #0d1b2a 100%);
    font-family: 'Georgia', serif; color: #e2d9f3;
    overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
  }

  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes sparkPop { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }
  @keyframes shimmer { 0% { background-position: -200% center; } 100% { background-position: 200% center; } }
  @keyframes floatStar { 0%,100% { opacity: 0.3; transform: translateY(0); } 50% { opacity: 0.8; transform: translateY(-6px); } }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #4a3670; border-radius: 2px; }

  input, textarea, select {
    font-family: 'Raleway', sans-serif;
    -webkit-appearance: none;
    border-radius: 0;
  }
  button {
    -webkit-appearance: none;
    border: none;
    cursor: pointer;
    font-family: 'Raleway', sans-serif;
  }

  .stars { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .star {
    position: absolute; width: 2px; height: 2px; border-radius: 50%;
    background: #c4b5fd; opacity: 0.3;
    animation: floatStar 4s ease-in-out infinite;
  }

  .app { max-width: 480px; margin: 0 auto; padding: 20px 16px 120px; position: relative; z-index: 1; }

  .header { text-align: center; margin-bottom: 24px; animation: fadeIn 0.6s ease; }
  .header-icon { font-size: 32px; margin-bottom: 4px; }
  .header-title {
    font-family: 'Cinzel', serif; font-size: 22px; font-weight: 700;
    letter-spacing: 3px; text-transform: uppercase;
    background: linear-gradient(90deg, #c4b5fd, #fbbf24, #c4b5fd);
    background-size: 200% auto; animation: shimmer 4s linear infinite;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; margin-bottom: 6px;
  }
  .header-sub {
    font-family: 'Raleway', sans-serif; font-size: 11px; letter-spacing: 1.5px;
    color: #8b7faa; text-transform: uppercase; font-weight: 300;
  }

  .stats-bar { display: flex; gap: 8px; margin-bottom: 20px; animation: fadeIn 0.6s ease 0.1s both; }
  .stat {
    flex: 1; text-align: center; padding: 14px 8px;
    background: rgba(139, 92, 246, 0.08); border-radius: 12px;
    border: 1px solid rgba(139, 92, 246, 0.15);
  }
  .stat-icon { font-size: 20px; }
  .stat-num { font-family: 'Cinzel', serif; font-size: 22px; font-weight: 700; color: #fbbf24; line-height: 1.2; }
  .stat-label { font-family: 'Raleway', sans-serif; font-size: 9px; letter-spacing: 1.5px; color: #8b7faa; text-transform: uppercase; font-weight: 500; }

  .tab-nav {
    display: flex; gap: 4px; margin-bottom: 20px; padding: 4px;
    background: rgba(15, 10, 30, 0.5); border-radius: 12px;
    border: 1px solid rgba(139, 92, 246, 0.1);
  }
  .tab-btn {
    flex: 1; padding: 10px 8px; border-radius: 10px;
    font-size: 12px; font-weight: 500; letter-spacing: 0.5px;
    background: transparent; color: #6b5f8a; transition: all 0.2s ease;
  }
  .tab-btn.active { background: rgba(139, 92, 246, 0.2); color: #e2d9f3; }

  .section { animation: fadeIn 0.4s ease; }

  .date-nav {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px; padding: 12px 16px;
    background: rgba(139, 92, 246, 0.06); border-radius: 12px;

  .nav-btn { background: none; color: #c4b5fd; font-size: 24px; padding: 4px 12px; }
  .date-label { font-family: 'Cinzel', serif; font-size: 15px; font-weight: 600; color: #e2d9f3; }

  /* Workout Picker */
  .picker-header {
    font-family: 'Cinzel', serif; font-size: 15px; color: #c4b5fd;
    text-align: center; margin-bottom: 16px;
  }
  .picker-list { display: flex; flex-direction: column; gap: 8px; }
  .picker-card {

  .workout-icon { font-size: 28px; margin-bottom: 4px; }

  .exercise-item.checked {

  .exercise-check.off { background: rgba(139, 92, 246, 0.15); color: #6b5f8a; }
  .exercise-name { font-size: 13px; font-weight: 400; flex: 1; }
  .exercise-sets { font-size: 11px; color: #6b5f8a; }
  .exercise-rounds {

  }

  .input-row { display: flex; gap: 10px; margin-top: 16px; }
  .input-group { flex: 1; }
  .input-label {
    font-family: 'Raleway', sans-serif; font-size: 10px; letter-spacing: 1.5px;
    color: #6b5f8a; text-transform: uppercase; font-weight: 500;
    display: block; margin-bottom: 4px;
  }
  .text-input {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    background: rgba(15, 10, 30, 0.6); border: 1px solid rgba(139, 92, 246, 0.15);
    color: #e2d9f3; font-size: 13px; outline: none;
  }
  .text-input:focus { border-color: rgba(139, 92, 246, 0.4); }

  .mood-section {
    padding: 20px; margin-bottom: 16px; border-radius: 16px;
    background: rgba(139, 92, 246, 0.04);
    border: 1px solid rgba(139, 92, 246, 0.1);
  }
  .mood-row { margin-bottom: 16px; }
  .mood-row:last-child { margin-bottom: 0; }
  .mood-label {
    font-family: 'Raleway', sans-serif; font-size: 10px; letter-spacing: 1.5px;
    color: #6b5f8a; text-transform: uppercase; font-weight: 500; margin-bottom: 8px;
  }
  .mood-grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .mood-btn {
    padding: 6px 12px; border-radius: 20px;
    font-size: 12px; font-weight: 400; transition: all 0.2s;
    background: rgba(15, 10, 30, 0.4); color: #8b7faa;
    border: 1px solid rgba(139, 92, 246, 0.1);
  }
  .mood-btn.active {
    background: rgba(251, 191, 36, 0.15); color: #fbbf24;
    border-color: rgba(251, 191, 36, 0.3);
  }

  .pride-section {
    padding: 20px; border-radius: 16px; margin-bottom: 16px;
    background: rgba(251, 191, 36, 0.03);
    border: 1px solid rgba(251, 191, 36, 0.1);
  }
  .pride-label {
    font-family: 'Cinzel', serif; font-size: 13px; font-weight: 600;
    color: #fbbf24; display: block; margin-bottom: 8px;
  }
  .notes-label {
    font-family: 'Raleway', sans-serif; font-size: 10px; letter-spacing: 1.5px;
    color: #6b5f8a; text-transform: uppercase; font-weight: 500;
    display: block; margin-bottom: 6px; margin-top: 16px;
  }
  .notes-input {
    width: 100%; padding: 12px 14px; border-radius: 10px;
    background: rgba(15, 10, 30, 0.6); border: 1px solid rgba(139, 92, 246, 0.1);
    color: #e2d9f3; font-size: 13px; outline: none; resize: vertical;
    font-family: 'Raleway', sans-serif; line-height: 1.5; min-height: 70px;
  }
  .pride-input {
    width: 100%; padding: 12px 14px; border-radius: 10px;
    background: rgba(15, 10, 30, 0.6); border: 1px solid rgba(251, 191, 36, 0.12);
    color: #e2d9f3; font-size: 13px; outline: none;
    font-family: 'Raleway', sans-serif;
  }

  /* Desk Tab — unchanged */
  .desk-header {
    text-align: center; margin-bottom: 20px;
    font-family: 'Cinzel', serif; font-size: 15px; color: #c4b5fd;
  }
  .desk-sub {
    font-family: 'Raleway', sans-serif; font-size: 12px; color: #6b5f8a;
    text-align: center; margin-bottom: 20px; font-weight: 300;
  }
  .desk-list { display: flex; flex-direction: column; gap: 10px; }
  .desk-item {
    display: flex; align-items: center; gap: 14px; padding: 16px 18px;
    border-radius: 14px; text-align: left; transition: all 0.2s;
    background: rgba(15, 10, 30, 0.3);
    border: 1px solid rgba(139, 92, 246, 0.08);
  }
  .desk-item.has-sets {
    background: rgba(139, 92, 246, 0.08);
    border-color: rgba(139, 92, 246, 0.2);
  }
  .desk-item.sparkling { animation: sparkPop 0.4s ease; }
  .desk-icon-wrap {
    width: 44px; height: 44px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
    background: rgba(139, 92, 246, 0.06);
  }
  .desk-item.has-sets .desk-icon-wrap {
    background: linear-gradient(135deg, rgba(251,191,36,0.15), rgba(139,92,246,0.15));
  }
  .desk-name { font-size: 14px; font-weight: 500; color: #e2d9f3; }
  .desk-target { font-size: 11px; color: #6b5f8a; font-weight: 300; margin-top: 2px; }
  .desk-count {
    min-width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Cinzel', serif; font-size: 16px; font-weight: 700;
    color: #4a3670; background: rgba(139, 92, 246, 0.05);
    border: 1px solid rgba(139, 92, 246, 0.1);
  }
  .desk-count.active { color: #fbbf24; background: rgba(251,191,36,0.1); border-color: rgba(251,191,36,0.2); }

  .desk-tip {
    margin-top: 20px; padding: 16px; border-radius: 12px;
    background: rgba(251, 191, 36, 0.03);
    border: 1px solid rgba(251, 191, 36, 0.08);
    text-align: center; font-family: 'Raleway', sans-serif;
    font-size: 11px; color: #8b7faa; font-weight: 300; line-height: 1.6;
  }

  /* Week / Goals Tab */
  .goals-title {
    text-align: center; margin-bottom: 4px;
    font-family: 'Cinzel', serif; font-size: 15px; color: #c4b5fd;
  }
  .goals-subtitle {
    text-align: center; margin-bottom: 16px;
    font-family: 'Raleway', sans-serif; font-size: 11px; color: #6b5f8a; font-weight: 300;
  }
  .goal-row {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    border-radius: 10px; margin-bottom: 6px;
    background: rgba(15, 10, 30, 0.2);
    border: 1px solid rgba(139, 92, 246, 0.06);
  }
  .goal-row.met {
    background: rgba(251, 191, 36, 0.06);
    border-color: rgba(251, 191, 36, 0.15);
  }
  .goal-icon { font-size: 20px; flex-shrink: 0; }
  .goal-name { font-family: 'Raleway', sans-serif; font-size: 13px; font-weight: 500; flex: 1; min-width: 0; }
  .goal-count { font-family: 'Cinzel', serif; font-size: 14px; font-weight: 600; color: #fbbf24; white-space: nowrap; }
  .goal-bar { flex: 0 0 60px; height: 6px; border-radius: 3px; background: rgba(15,10,30,0.5); overflow: hidden; }
  .goal-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #8b5cf6, #fbbf24); transition: width 0.5s ease; }
  .goal-input {
    width: 44px; padding: 4px 6px; border-radius: 6px; text-align: center;
    background: rgba(15, 10, 30, 0.6); border: 1px solid rgba(139, 92, 246, 0.2);
    color: #fbbf24; font-size: 14px; font-family: 'Cinzel', serif; font-weight: 600;
    outline: none;
  }
  .goal-input:focus { border-color: rgba(251, 191, 36, 0.4); }
  .edit-goals-btn {
    display: block; margin: 8px auto 20px; padding: 6px 16px; border-radius: 16px;
    background: rgba(139, 92, 246, 0.06); color: #6b5f8a;
    font-size: 11px; letter-spacing: 0.5px;
    border: 1px solid rgba(139, 92, 246, 0.08);

  .goals-met-msg {
    margin-top: 12px; padding: 12px; border-radius: 10px;

    border: 1px solid rgba(251, 191, 36, 0.15);

    font-size: 13px; color: #fbbf24; font-weight: 500;

  .week-log-title {
    font-family: 'Cinzel', serif; font-size: 13px; color: #c4b5fd;

  .week-item {

    border: 1px solid rgba(139, 92, 246, 0.06);

  .week-item.is-today {
    background: rgba(139, 92, 246, 0.1);
    border-color: rgba(139, 92, 246, 0.25);

  .week-icon-wrap {
    width: 36px; height: 36px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center; font-size: 18px;
    flex-shrink: 0;
  }
  .week-icon-wrap.completed {

  }
  .week-date { font-family: 'Raleway', sans-serif; font-size: 12px; font-weight: 500; color: #e2d9f3; }
  .week-date.today-text { color: #fbbf24; }
  .week-type { font-family: 'Raleway', sans-serif; font-size: 11px; font-weight: 400; margin-top: 2px; }
  .week-status { font-size: 11px; color: #fbbf24; font-family: 'Raleway', sans-serif; }
  .week-mood { font-size: 10px; color: #6b5f8a; font-family: 'Raleway', sans-serif; }
  .week-desk-count { font-size: 10px; color: #8b7faa; font-family: 'Raleway', sans-serif; }

  .week-summary {
    margin-top: 16px; padding: 16px; border-radius: 14px;

  .week-summary-title {
    font-family: 'Cinzel', serif; font-size: 12px; font-weight: 600;

  }
  .week-summary-text { font-family: 'Raleway', sans-serif; font-size: 13px; color: #e2d9f3; line-height: 1.8; font-weight: 300; }

  .progress-bar { height: 6px; border-radius: 3px; background: rgba(15,10,30,0.5); overflow: hidden; margin-top: 8px; }

  .reset-btn {

    background: rgba(139, 92, 246, 0.05); color: #4a3670;
    border: 1px solid rgba(139, 92, 246, 0.1);
    font-size: 11px; letter-spacing: 1px; font-weight: 400;
    transition: all 0.2s;
  }
</style>

<body>

<div class="stars" id="stars"></div>

<div class="app" id="app">
  <div style="text-align:center;padding:60px 20px;">
    <div style="font-size:40px;margin-bottom:12px;">✨</div>
    <div style="font-size:18px;letter-spacing:2px;animation:pulse 2s infinite;">Waking up the Captain...</div>
  </div>
</div>

<script>
// === DATA ===
const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

const WORKOUT_TYPES = [
  { id: "castle", type: "Castle", icon: "🏰", desc: "Pilates + bands + weights during Castle", color: "#dc2626" },
  { id: "trail", type: "Trail", icon: "🌲", desc: "Ocean trail walk + circuit at halfway", color: "#059669" },
  { id: "strength", type: "Strength", icon: "💪", desc: "Resistance bands — upper, lower, core", color: "#e11d48" },
  { id: "rowing", type: "Rowing", icon: "🚣", desc: "15 min rowing", color: "#8b5cf6" },
  { id: "yoga", type: "Yoga", icon: "🧘", desc: "Flexibility & nervous system work", color: "#0ea5e9" },
  { id: "sprints", type: "Sprints", icon: "⚡", desc: "20 min intervals. Go hard. Rest. Repeat.", color: "#f59e0b" },
  { id: "play", type: "Play", icon: "✨", desc: "Whatever feels fun. Dance. Hike. Swim.", color: "#a855f7" },
  { id: "rest", type: "Rest", icon: "🌙", desc: "Stretch. Foam roll. Recover. You earned it.", color: "#64748b" },
];

function getWorkoutType(id) { return WORKOUT_TYPES.find(w => w.id === id); }

const CASTLE_ROUTINES = {
  A: {
    name: "The Arms Episode",
    icon: "\u{1F5E1}️",

// === STORAGE ===
function loadData(key, fallback) {
  try {
    const d = localStorage.getItem('cott_' + key);
    return d ? JSON.parse(d) : fallback;
  } catch(e) { return fallback; }
}
function saveData(key, val) {
  try { localStorage.setItem('cott_' + key, JSON.stringify(val)); } catch(e) {}
}

// === STATE ===
let entries = loadData('entries', {});
let deskSets = loadData('desk', {});
let weeklyGoals = loadData('goals', {...GOALS_DEFAULT});
let selectedDate = new Date();
let currentTab = 'today';
let editingGoals = false;

// === HELPERS ===
function dk(d) { return d.toISOString().split('T')[0]; }
function dn(d) { return DAYS[d.getDay()]; }
function fmt(d) { return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }); }

function getEntry(key) {
  const raw = entries[key];
  const base = {
    workoutType: null, castleRoutine: null,
    completed: false, moodBefore: "", moodAfter: "", proud: "",
    notes: "", exerciseChecks: {}, heartRate: "", duration: "",
  };
  if (!raw) return base;
  // Migrate old entries: strengthChecks -> exerciseChecks
  const merged = { ...base, ...raw };
  if (raw.strengthChecks && !raw.exerciseChecks) {
    merged.exerciseChecks = raw.strengthChecks;
  }
  // Migrate old day-locked entries: infer workoutType from day of week
  if (merged.completed && !merged.workoutType) {
    const d = new Date(key + 'T12:00:00');
    const dayName = DAYS[d.getDay()];
    const oldMap = { Monday:"rowing", Tuesday:"trail", Wednesday:"strength",
                     Thursday:"yoga", Friday:"sprints", Saturday:"play", Sunday:"rest" };
    merged.workoutType = oldMap[dayName] || null;
  }
  return merged;
}

function updateEntry(key, updates) {
  entries[key] = { ...getEntry(key), ...updates };
  saveData('entries', entries);
  render();
}

function selectWorkout(key, typeId) {
  updateEntry(key, { workoutType: typeId });
}

function selectCastleRoutine(key, routine) {
  updateEntry(key, { castleRoutine: routine });
}

function clearWorkout(key) {
  updateEntry(key, {
    workoutType: null, castleRoutine: null, completed: false,
    exerciseChecks: {}, heartRate: "", duration: "",
    moodBefore: "", moodAfter: "", proud: "", notes: "",
  });
}

function toggleDesk(id) {
  const key = dk(selectedDate);
  const day = deskSets[key] || {};
  day[id] = (day[id] || 0) + 1;
  deskSets[key] = day;
  saveData('desk', deskSets);
  render();
  const el = document.getElementById('desk-' + id);
  if (el) { el.classList.add('sparkling'); setTimeout(() => el.classList.remove('sparkling'), 400); }
}

function navDay(offset) {
  const d = new Date(selectedDate);
  d.setDate(d.getDate() + offset);
  selectedDate = d;
  render();
}

function setTab(t) { currentTab = t; render(); }

function goToDay(dateStr) {
  selectedDate = new Date(dateStr + 'T12:00:00');
  currentTab = 'today';
  render();
}

function updateGoal(typeId, value) {
  weeklyGoals[typeId] = Math.max(0, Math.min(7, parseInt(value) || 0));
  saveData('goals', weeklyGoals);
  render();
}

function toggleEditGoals() {
  editingGoals = !editingGoals;
  render();
}

// === WEEK HELPERS ===
function getWeekStart(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day; // Monday start
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}

function getWeekDays(startDate) {
  return Array.from({length: 7}, (_, i) => {
    const d = new Date(startDate);
    d.setDate(startDate.getDate() + i);
    return d;
  });
}

function getWeekCounts() {
  const start = getWeekStart(new Date());
  const days = getWeekDays(start);
  const counts = {};
  for (const d of days) {
    const e = entries[dk(d)];
    if (e && e.completed && e.workoutType) {
      counts[e.workoutType] = (counts[e.workoutType] || 0) + 1;
    }
  }
  return counts;
}

function getSuggestedCastleRoutine() {
  // Look at recent castle entries and suggest the one done least recently
  const recent = [];
  const d = new Date();
  for (let i = 0; i < 30; i++) {
    const e = entries[dk(d)];
    if (e && e.workoutType === 'castle' && e.castleRoutine) {
      recent.push(e.castleRoutine);
    }
    d.setDate(d.getDate() - 1);
  }
  // Suggest the one NOT done recently
  const order = ['A', 'B', 'C'];
  for (const r of order) {
    if (!recent.includes(r)) return r;
  }
  // All done at least once, suggest the one done longest ago
  for (const r of order) {
    if (recent.indexOf(r) === recent.length - 1 || recent.lastIndexOf(r) > 2) continue;
  }
  // Simple rotation: pick the one that isn't the most recent
  if (recent.length === 0) return 'A';
  const last = recent[0];
  const next = { A: 'B', B: 'C', C: 'A' };
  return next[last] || 'A';
}

// === STATS ===
function getStats() {
  const totalW = Object.values(entries).filter(e => e.completed).length;
  let streak = 0;
  const d = new Date();
  for (let i = 0; i < 90; i++) {
    const k = dk(d);
    const dayName = dn(d);
    if (dayName === "Sunday") { d.setDate(d.getDate() - 1); continue; }
    if (entries[k] && entries[k].completed) { streak++; d.setDate(d.getDate() - 1); }
    else break;
  }
  const totalD = Object.values(deskSets).reduce((s, day) =>
    s + Object.values(day).reduce((a, v) => a + v, 0), 0);
  return { totalW, streak, totalD };
}

function initStars() {
  const c = document.getElementById('stars');
  for (let i = 0; i < 25; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.top = Math.random() * 100 + '%';
    s.style.left = Math.random() * 100 + '%';
    s.style.animationDuration = (3 + Math.random() * 4) + 's';
    s.style.animationDelay = (Math.random() * 3) + 's';
    c.appendChild(s);
  }
}

    html += '<div class="goals-subtitle">' + weekLabel + '</div>';

    let totalGoal = 0;
    let totalDone = 0;
    let hasGoals = false;

    for (const wt of WORKOUT_TYPES) {
      if (wt.id === 'rest') continue;
      const goal = weeklyGoals[wt.id] || 0;
      const done = weekCounts[wt.id] || 0;

      if (editingGoals || goal > 0) {
        hasGoals = true;
        const met = done >= goal && goal > 0;
        const pct = goal > 0 ? Math.min(100, Math.round((done / goal) * 100)) : 0;

        html += '<div class="goal-row ' + (met ? 'met' : '') + '">' +
          '<div class="goal-icon">' + wt.icon + '</div>' +
          '<div class="goal-name">' + wt.type + '</div>';

        if (editingGoals) {
          html += '<input class="goal-input" type="number" min="0" max="7" value="' + goal + '" onchange="updateGoal(\'' + wt.id + '\', this.value)">';
        } else {
          html += '<div class="goal-count">' + done + '/' + goal + '</div>' +
            '<div class="goal-bar"><div class="goal-fill" style="width:' + pct + '%"></div></div>';
        }
        html += '</div>';

        if (goal > 0) { totalGoal += goal; totalDone += Math.min(done, goal); }
      }
    }

    if (!hasGoals && !editingGoals) {
      html += '<div style="text-align:center;padding:20px;font-family:Raleway,sans-serif;font-size:13px;color:#6b5f8a">' +
        'No weekly goals set yet. Tap edit to set your targets!</div>';
    }

    // All goals met?
    if (hasGoals && totalDone >= totalGoal && totalGoal > 0 && !editingGoals) {
      html += '<div class="goals-met-msg">\u{1F451} All weekly goals crushed. The captain showed UP. \u{1F451}</div>';
    }

    html += '<button class="edit-goals-btn" onclick="toggleEditGoals()">' + (editingGoals ? '✓ Done editing' : '✏️ Edit goals') + '</button>';

    // Daily Log
    html += '<div class="week-log-title">This Week</div>';
    html += '<div class="week-list">';

    const weekDays = getWeekDays(weekStart);

    for (const d of weekDays) {
      const k = dk(d);
      const e = entries[k];
      const isToday = dk(d) === dk(today);
      const dSets = deskSets[k] ? Object.values(deskSets[k]).reduce((a, v) => a + v, 0) : 0;

      let dayIcon = '·';
      let dayColor = '#6b5f8a';
      let typeLabel = '';

      if (e && e.completed && e.workoutType) {
        const wt = getWorkoutType(e.workoutType);
        if (wt) {
          dayIcon = '✓';
          dayColor = wt.color;
          typeLabel = wt.icon + ' ' + wt.type;
          if (e.workoutType === 'castle' && e.castleRoutine) {
            const cr = CASTLE_ROUTINES[e.castleRoutine];
            if (cr) typeLabel += ' · ' + cr.name;
          }
        }
      } else if (e && e.workoutType) {
        const wt = getWorkoutType(e.workoutType);
        if (wt) {
          dayColor = wt.color;
          typeLabel = wt.icon + ' ' + wt.type + ' (in progress)';
        }
      }

      html += '<button class="week-item ' + (isToday ? 'is-today' : '') + '" onclick="goToDay(\'' + k + '\')">' +
        '<div class="week-icon-wrap ' + (e && e.completed ? 'completed' : '') + '" style="' + (!(e && e.completed) ? 'background:' + dayColor + '10' : '') + '">' +
        dayIcon +
        '</div>' +
        '<div style="flex:1">' +
        '<div class="week-date ' + (isToday ? 'today-text' : '') + '">' + d.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'}) + (isToday ? ' · today' : '') + '</div>' +
        (typeLabel ? '<div class="week-type" style="color:' + dayColor + '">' + typeLabel + '</div>' : '') +
        '</div>' +
        '<div style="text-align:right">' +
        (e && e.completed ? '<div class="week-status">Done ✨</div>' : '') +
        (e && e.moodAfter ? '<div class="week-mood">Felt: ' + e.moodAfter + '</div>' : '') +
        (dSets > 0 ? '<div class="week-desk-count">\u{1F4BC} ' + dSets + ' desk sets</div>' : '') +
        '</div></button>';
    }

    html += '</div>';

    // Week summary
    const weekDone = Object.keys(entries).filter(k => {
      const d = new Date(k + 'T12:00:00');
      return d >= weekStart && d <= weekEnd && entries[k].completed;
    }).length;

    html += '<div class="week-summary">' +
      '<div class="week-summary-title">Week Summary</div>' +
      '<div class="week-summary-text">' +
      '<span class="week-summary-count">' + weekDone + '</span> workouts this week' +
      (totalGoal > 0 ? ' · <span class="week-summary-count">' + totalDone + '/' + totalGoal + '</span> goals hit' : '') +
      '</div></div>';

    html += '</div>'; // end section
  }

  // Reset
  html += '<div class="reset-section">' +
    '<button class="reset-btn" onclick="if(confirm(\'Clear all data? This cannot be undone.\')){localStorage.clear();entries={};deskSets={};weeklyGoals={...GOALS_DEFAULT};render();}">Reset All Data</button>' +
    '</div>';

  app.innerHTML = html;
}

// Expose helper for inline onclick
window._ge = getEntry;

// Init
initStars();
render();
</script>
</body>
</html>
